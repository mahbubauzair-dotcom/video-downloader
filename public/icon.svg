<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Video Stream Segments Visual Grid -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 12" />
    <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 10" />
  </g>

  <!-- Stream Segments Blocks -->
  <g transform="translate(136, 120)">
    <!-- Segment Blocks representing .ts parts -->
    <rect x="0" y="0" width="46" height="18" rx="6" fill="#38bdf8" />
    <rect x="54" y="0" width="46" height="18" rx="6" fill="#6366f1" />
    <rect x="108" y="0" width="46" height="18" rx="6" fill="#8b5cf6" />
    <rect x="162" y="0" width="78" height="18" rx="6" fill="#ec4899" />
  </g>

  <!-- Main Downloader Symbol -->
  <g filter="url(#shadow)">
    <!-- Shield / Container Hexagon/Rounded Card -->
    <rect x="136" y="160" width="240" height="240" rx="36" fill="#1e293b" stroke="url(#glow)" stroke-width="5" />
    
    <!-- Play Stream Triangle Indicator -->
    <path d="M 220 220 L 220 270 L 262 245 Z" fill="url(#accent)" />
    
    <!-- Big Download Arrow Piercing -->
    <path d="M 256 200 L 256 310" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" />
    <path d="M 224 282 L 256 314 L 288 282" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Video Segment Tray / Concatenation Base -->
    <path d="M 190 340 L 322 340" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" />
    <circle cx="190" cy="340" r="4" fill="#fff" />
    <circle cx="256" cy="340" r="4" fill="#fff" />
    <circle cx="322" cy="340" r="4" fill="#fff" />
  </g>

  <!-- Label 'M3U8' badge at bottom -->
  <rect x="196" y="420" width="120" height="34" rx="17" fill="url(#glow)" />
  <text x="256" y="443" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">M3U8</text>
</svg>
